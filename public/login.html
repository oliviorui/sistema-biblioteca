<!doctype html>
<html lang="pt-pt">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Login | Biblioteca</title>
  <link rel="stylesheet" href="./assets/css/styles.css">
</head>
<body>
  <div class="container">
    <div class="nav">
      <div class="brand">Biblioteca • Login</div>
      <div class="grow"></div>
      <a href="./index.html" class="btn secondary">Voltar</a>
    </div>

    <div class="card" style="margin-top:16px">
      <h2 style="margin-top:0">Entrar</h2>
      <p class="hint">Demo: <span class="mono">admin@local</span> / <span class="mono">admin123</span></p>

      <form id="loginForm" class="grid">
        <div class="field"><label>Email</label><input id="email" class="input" type="email" placeholder="admin@local" required></div>

        <div class="field"><label>Senha</label><input id="password" class="input" type="password" placeholder="********" required></div>
        
        <small id="loginError" class="hint" style="color:#C0392B"></small>
        <div><button class="btn">Entrar</button></div>
      </form>
    </div>
  </div>
</body>
</html>
